const{data,error}=await db.rpc("create_order",{p_offer:sel.o,pid,m:m.code,proof});
await new Promise(r=>setTimeout(r,1500));ss[2].classList.add("on");await new Promise(r=>setTimeout(r,900));
if(error){o.remove();return toast(error.message)}
st={pid:"",file:null};o.querySelector("#pt").textContent="✅ Pedido en proceso";o.querySelector("#st").innerHTML=`<p class="m">Orden #${data} · te avisaremos al completarse</p><button class="btn" style="margin-top:14px" id="ok">Ver mis órdenes</button>`;
o.querySelector("#ok").onclick=async()=>{o.remove();await load();go("orders")}}
let REF=null;try{REF=new URLSearchParams(location.search).get("ref");if(REF)localStorage.setItem("ref",REF)}catch(e){}
const getRef=()=>{try{return localStorage.getItem("ref")}catch(e){return null}};
async function todayR(){const d=new Date();d.setHours(0,0,0,0);const{data}=await db.from("orders").select("*").eq("user_id",me.id).gte("created_at",d.toISOString()).order("id",{ascending:false});const L={pending:"En proceso",done:"Completada",rejected:"Rechazada"};
const e=document.getElementById("today");if(!e)return;e.innerHTML=`<div class="card"><div class="row"><b>📅 Tus recargas de hoy</b><span class="tag">${(data||[]).length}</span></div>${(data||[]).map(o=>`<div class="row" style="margin-top:10px"><div><b>${esc(o.pack)}</b><br><span class="m">${esc(o.game)}</span></div><div style="text-align:right">${fmt(o.amount??o.price)} ${esc(o.symbol||"USD")}<br><span class="tag ${o.status}">${L[o.status]}</span></div></div>`).join("")||'<p class="m" style="margin-top:6px">Aún no has recargado hoy.</p>'}</div>`}
async function refv(){if(!me)return go("auth");const{data}=await db.rpc("ref_stats");if(!data)return out('<p class="m">Ejecuta update2.sql en Supabase.</p>');
const link=location.origin+location.pathname+"?ref="+data.code,n=Number(data.count),rate=2*Math.floor(n/19),falta=19-n%19;
out(`<div class="card"><h2>🎁 Invita y gana</h2><p class="m" style="margin:6px 0 10px">Gana 2% de las recargas de tus referidos por cada 19 personas verificadas que se unan con tu enlace.</p><input id="rl" readonly value="${esc(link)}"><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('rl').value).then(()=>toast('Enlace copiado'))">Copiar mi enlace</button><a href="https://wa.me/?text=${encodeURIComponent("Recarga tus juegos en Madi Diamond YT: "+link)}" target="_blank"><button class="btn s" style="margin-top:8px">Compartir por WhatsApp</button></a></div>
<div class="card"><div class="grid"><div><h1>${n}</h1><span class="m">Referidos verificados</span></div><div><h1>${rate}%</h1><span class="m">Tu ganancia actual</span></div></div><div style="height:10px;background:var(--line);border-radius:9px;margin:14px 0 6px;overflow:hidden"><div style="height:100%;width:${(n%19)/19*100}%;background:linear-gradient(90deg,#1f5bff,#5ab0ff)"></div></div><p class="m">Te faltan ${falta} para ${rate?"subir al "+(rate+2)+"%":"ganar el 2%"}.</p><p style="margin-top:8px">Has ganado: <b>${fmt(data.earned)} ${M}</b></p></div>`)}
async function orders(){if(!me)return go("auth");const{data}=await db.from("orders").select("*").eq("user_id",me.id).order("id",{ascending:false});
const L={pending:"En proceso",done:"Completada",rejected:"Rechazada"};
out(`<h2 style="margin-bottom:12px">Mis órdenes</h2>${(data||[]).map(o=>`<div class="card row"><div><b>${esc(o.pack)}</b><br><span class="m">${esc(o.game)} · ID ${esc(o.player_id)} · #${o.id}</span></div><div style="text-align:right">${fmt(o.amount??o.price)} ${esc(o.symbol||"USD")}<br><span class="tag ${o.status}">${L[o.status]}</span></div></div>`).join("")||'<p class="m">Aún no tienes pedidos.</p>'}`)}
function wallet(){if(!me)return go("auth");out(`<div class="hero"><span class="tag">Saldo disponible</span><h1 style="margin-top:10px">${Number(me.credits).toFixed(2)} ${M}</h1><p class="m">1 crédito = 1 USD</p></div><a href="https://wa.me/${WA}?text=${encodeURIComponent("Hola, quiero recargar créditos. Mi correo: "+me.email)}"><button class="btn" style="margin-top:14px">Añadir créditos por WhatsApp</button></a>`)}
function prof(){if(!me)return go("auth");out(`<div class="card"><h2>${esc(me.name)}</h2><p class="m">${esc(me.email)} · ${esc(me.phone)}</p><p style="margin:8px 0"><span class="tag">${me.role==="admin"?"Admin":"Cliente"}</span> <span class="tag ${me.verified?"done":"rejected"}">${me.verified?"Verificado":"Sin verificar"}</span></p>${me.verified?"":'<button class="btn s" onclick="go(\'verify\')">Verificar cuenta</button>'}</div><button class="btn" style="margin-bottom:10px" onclick="go('ref')">🎁 Referidos · Invita y gana</button><button class="btn r" onclick="db.auth.signOut().then(()=>{view=\'home\';load()})">Cerrar sesión</button>`)}
let reg=false;
function auth(){out(`<div class="card"><div class="pay"><button class="${reg?"":"on"}" onclick="reg=false;auth()">Iniciar sesión</button><button class="${reg?"on":""}" onclick="reg=true;auth()">Crear cuenta</button></div>
${reg?'<input id="n" placeholder="Nombre"><input id="ph" type="tel" placeholder="Número (con código de país)">':""}<input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña (mín. 6)"><button class="btn" style="margin-top:8px" onclick="doAuth()">${reg?"Crear cuenta":"Entrar"}</button></div>`)}
async function doAuth(){const email=$("#em").value.trim(),password=$("#pw").value;let r;
if(reg){const name=$("#n").value.trim(),phone=$("#ph").value.trim();if(!name||!phone)return toast("Completa todos los campos");r=await db.auth.signUp({email,password,options:{data:{name,phone,ref:getRef()}}})}else r=await db.auth.signInWithPassword({email,password});
if(r.error)return toast(r.error.message);await load();view=me?.verified?"home":"verify";nav();render()}
function verify(){if(!me)return go("auth");out(`<div class="card"><h2>Verifica tu cuenta</h2><p class="m" style="margin:8px 0">Toca el botón, envíanos el mensaje por WhatsApp y te daremos tu código de 6 dígitos.</p><a href="https://wa.me/${WA}?text=${encodeURIComponent("Hola, quiero mi código de verificación. Correo: "+me.email)}" target="_blank"><button class="btn">Pedir código por WhatsApp</button></a><input id="cd" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos"><button class="btn s" onclick="doVer()">Confirmar código</button></div>`)}
async function doVer(){const{data}=await db.rpc("verify_me",{c:$("#cd").value.trim()});if(!data)return toast("Código incorrecto");toast("¡Cuenta verificada!");await load();go("home")}
async function notices(){const{data}=await db.from("notices").select("*").order("id",{ascending:false});out(`<h2 style="margin-bottom:12px">Avisos</h2>${(data||[]).map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="m">${esc(n.body)}</p></div>`).join("")||'<p class="m">Sin avisos.</p>'}`);$("#dot").hidden=true}
const val=id=>document.getElementById(id).value,pr=p=>p&&p.startsWith(SUPABASE_URL+"/storage/")?`<a href="${esc(p)}" target="_blank" rel="noopener"><img class="pv" src="${esc(p)}"></a>`:"";
async function admin(){if(me?.role!=="admin")return go("home");const T=[["orders","Pedidos"],["users","Clientes"],["credits","Créditos"],["games","Juegos"],["pay","Pagos"],["notes","Avisos"]];
let h=`<h2 style="margin-bottom:10px">🛡️ Panel admin</h2><div class="tabs">${T.map(t=>`<button class="btn sm ${tab===t[0]?"":"s"}" onclick="tab='${t[0]}';admin()">${t[1]}</button>`).join("")}</div>`;
if(tab==="orders"){const{data}=await db.from("orders").select("*,profiles(email,name)").order("id",{ascending:false}).limit(60);
h+=(data||[]).map(o=>`<div class="card"><div class="row"><b>#${o.id} · ${esc(o.pack)}</b><span class="tag ${o.status}">${o.status}</span></div><p class="m">${esc(o.game)} · ID ${esc(o.player_id)} · ${fmt(o.amount??o.price)} ${esc(o.symbol||"USD")} ($${o.price}) · ${esc(o.method)}<br>${esc(o.profiles?.name)} (${esc(o.profiles?.email)})</p>${pr(o.proof)}${o.status==="pending"?`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="ord(${o.id},true)">Aceptar</button><button class="btn sm r" onclick="ord(${o.id},false)">Rechazar</button></div>`:""}</div>`).join("")}
if(tab==="users"){const{data}=await db.from("profiles").select("*").order("created_at",{ascending:false});const cs=(await db.from("codes").select("*")).data||[];
h+=(data||[]).map(u=>`<div class="card"><b>${esc(u.name)}</b> <span class="tag">${u.role}</span> ${u.verified?'<span class="tag done">verificado</span>':`<span class="tag rejected">código ${cs.find(c=>c.user_id===u.id)?.code||""}</span>`}${u.banned?' <span class="tag rejected">baneado</span>':""}<p class="m">${esc(u.email)} · ${esc(u.phone)} · ${Number(u.credits).toFixed(2)} créditos</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn sm s" onclick="fl('${u.id}','banned','${!u.banned}')">${u.banned?"Desbanear":"Banear"}</button>${u.verified?"":`<button class="btn sm s" onclick="fl('${u.id}','verified','true')">Verificar</button>`}<button class="btn sm s" onclick="fl('${u.id}','role','${u.role==="admin"?"user":"admin"}')">${u.role==="admin"?"Quitar admin":"Hacer admin"}</button></div></div>`).join("")}
if(tab==="credits"){const ms=(await db.from("methods").select("*").order("sort")).data||[];h+=`<div class="card"><input id="ce" type="email" placeholder="Correo del cliente"><input id="ca" type="number" step="0.01" placeholder="Cantidad (usa − para quitar)"><button class="btn" onclick="cr()">Aplicar créditos</button></div><div class="card"><b>Precios de los métodos de pago</b><p class="m" style="margin:4px 0 8px">Cuántas unidades de cada método cuestan 1 USD. Se aplica a todos los precios de la tienda.</p>${ms.map(m=>`<div class="row" style="gap:6px"><span style="min-width:96px">${esc(m.name)}</span><input id="rt${m.code}" type="number" step="0.0001" value="${m.rate}"><span class="m" style="min-width:64px">${esc(m.symbol)}</span></div>`).join("")}<button class="btn" style="margin-top:8px" onclick="saveRates()">Guardar todos los precios</button></div>`}
if(tab==="games"){const gs=(await db.from("games").select("*").order("sort")).data||[],os=(await db.from("offers").select("*").order("sort")).data||[];const AM=(await db.from("methods").select("*").order("sort")).data||[],pp={};((await db.from("offer_prices").select("*")).data||[]).forEach(r=>pp[r.offer_id+"|"+r.method_code]=r.price);window.AM=AM;
h+=`<div class="card"><b>Añadir juego</b><input id="ngn" placeholder="Nombre"><input id="ngu" placeholder="Unidad (Diamantes, Robux…)"><input id="ngl" placeholder="Pedir al cliente (Player ID o Correo)"><select id="ngk"><option value="d">Icono diamantes</option><option value="r">Icono robux</option><option value="c">Icono monedas</option></select><label class="up">🖼️ Imagen del juego<input type="file" accept="image/*" id="ngi" hidden></label><button class="btn" onclick="addG()">Añadir juego</button></div>`+
gs.map(g=>`<div class="card"><div class="row"><b>${esc(g.name)}</b><span class="tag ${g.active?"done":"rejected"}">${g.active?"visible":"oculto"}</span></div><input id="gn${g.id}" value="${esc(g.name)}"><input id="gu${g.id}" value="${esc(g.unit)}"><input id="gl${g.id}" value="${esc(g.id_label||"Player ID")}" placeholder="Pedir (Player ID o Correo)"><label class="up">🖼️ Cambiar imagen<input type="file" accept="image/*" id="gi${g.id}" hidden></label>
<div class="row" style="gap:6px"><button class="btn sm" onclick="saveG(${g.id})">Guardar</button><button class="btn sm s" onclick="tg('games',${g.id},${!g.active})">${g.active?"Ocultar":"Mostrar"}</button><button class="btn sm r" onclick="del('games',${g.id})">Eliminar</button></div>
<h3 style="margin:12px 0 4px">Ofertas</h3>${os.filter(o=>o.game_id===g.id).map(o=>`<div class="card" style="background:var(--in);padding:10px;margin:8px 0"><div class="row" style="gap:6px"><input id="ol${o.id}" value="${esc(o.label)}" placeholder="Cantidad"><input id="op${o.id}" type="number" step="0.01" value="${o.price}" placeholder="USD"><span class="m" style="min-width:34px">USD</span></div>${AM.map(m=>`<div class="row" style="gap:6px"><span style="min-width:96px">${esc(m.name)}</span><input id="pp${o.id}_${m.code}" type="number" step="0.01" value="${pp[o.id+"|"+m.code]??""}" placeholder="Auto: ${fmt(o.price*m.rate)}"><span class="m" style="min-width:64px">${esc(m.symbol)}</span></div>`).join("")}<div class="row" style="gap:6px;margin-top:6px"><button class="btn sm" onclick="saveO(${o.id})">Guardar precios</button><button class="btn sm r" onclick="del('offers',${o.id})">Eliminar</button></div></div>`).join("")}
<div class="row" style="gap:6px"><input id="nl${g.id}" placeholder="Cantidad"><input id="np${g.id}" type="number" step="0.01" placeholder="Precio USD"><button class="btn sm" onclick="addO(${g.id})">＋</button></div></div>`).join("")}
if(tab==="pay"){const ms=(await db.from("methods").select("*").order("sort")).data||[];
h+=`<p class="m" style="margin-bottom:10px">Tasa = cuántas unidades del símbolo cuestan 1 USD. El texto se muestra al cliente (número, tarjeta, correo…).</p>`+ms.map(m=>`<div class="card"><div class="row"><b>${esc(m.name)}</b><span class="tag ${m.active?"done":"rejected"}">${m.active?"activo":"oculto"}</span></div><input id="mn${m.code}" value="${esc(m.name)}" placeholder="Nombre"><div class="row" style="gap:6px"><input id="ms${m.code}" value="${esc(m.symbol)}" placeholder="Símbolo"><input id="mr${m.code}" type="number" step="0.0001" value="${m.rate}" placeholder="Tasa"></div><textarea id="mi${m.code}" rows="3" placeholder="Datos para pagar">${esc(m.info)}</textarea><div class="row" style="gap:6px"><button class="btn sm" onclick="saveM('${m.code}')">Guardar</button><button class="btn sm s" onclick="tgM('${m.code}',${!m.active})">${m.active?"Ocultar":"Mostrar"}</button></div></div>`).join("")+
`<div class="card"><b>Añadir método</b><input id="anm" placeholder="Nombre"><div class="row" style="gap:6px"><input id="asy" placeholder="Símbolo"><input id="arr" type="number" step="0.0001" placeholder="Tasa"></div><button class="btn" onclick="addM()">Añadir método</button></div>`}
if(tab==="notes"){const{data}=await db.from("notices").select("*").order("id",{ascending:false});h+=`<div class="card"><input id="nt" placeholder="Título"><input id="nb" placeholder="Mensaje"><button class="btn" onclick="nn()">Publicar aviso</button></div>`+(data||[]).map(n=>`<div class="card row"><div><b>${esc(n.title)}</b><p class="m">${esc(n.body)}</p></div><button class="btn sm r" onclick="dn(${n.id})">✕</button></div>`).join("")}
out(h)}
const run=async(p,ok)=>{const{error}=await p;if(error)return toast(error.message);toast(ok);await cat();admin()};
const ord=(id,ok)=>run(db.rpc("admin_order",{oid:id,ok}),"Listo"),fl=(uid,f,v)=>run(db.rpc("admin_flag",{uid,f,v}),"Actualizado");
const cr=()=>run(db.rpc("admin_credit",{em:$("#ce").value.trim(),amt:parseFloat($("#ca").value)}),"Créditos aplicados");
const nn=()=>run(db.from("notices").insert({title:$("#nt").value,body:$("#nb").value}),"Aviso publicado"),dn=id=>run(db.from("notices").delete().eq("id",id),"Eliminado");
async function addG(){const n=val("ngn").trim();if(!n)return toast("Falta el nombre");let img=null;const f=$("#ngi").files[0];if(f){const u=await upl(f,"games");if(u.error)return toast(u.error);img=u.url}
run(db.from("games").insert({name:n,unit:val("ngu")||"Unidades",id_label:val("ngl")||"Player ID",kind:val("ngk"),img,sort:99}),"Juego añadido")}
async function saveG(id){const d={name:val("gn"+id),unit:val("gu"+id),id_label:val("gl"+id)};const f=$("#gi"+id).files[0];if(f){const u=await upl(f,"games");if(u.error)return toast(u.error);d.img=u.url}run(db.from("games").update(d).eq("id",id),"Guardado")}
async function saveRates(){const ms=(await db.from("methods").select("code")).data||[];const r=await Promise.all(ms.map(m=>db.from("methods").update({rate:parseFloat(val("rt"+m.code))||1}).eq("code",m.code)));run(Promise.resolve({error:r.find(x=>x.error)?.error}),"Precios actualizados")}
async function saveO(id){const r=[await db.from("offers").update({label:val("ol"+id),price:parseFloat(val("op"+id))}).eq("id",id)];for(const m of window.AM){const v=val(`pp${id}_${m.code}`).trim();r.push(v===""?await db.from("offer_prices").delete().eq("offer_id",id).eq("method_code",m.code):await db.from("offer_prices").upsert({offer_id:id,method_code:m.code,price:parseFloat(v)},{onConflict:"offer_id,method_code"}))}run(Promise.resolve({error:r.find(x=>x.error)?.error}),"Precios guardados")}
const addO=g=>run(db.from("offers").insert({game_id:g,label:val("nl"+g),price:parseFloat(val("np"+g)),sort:99}),"Oferta añadida");
const tg=(t,id,v)=>run(db.from(t).update({active:v}).eq("id",id),"Listo"),del=(t,id)=>confirm("¿Eliminar?")&&run(db.from(t).delete().eq("id",id),"Eliminado");
const saveM=c=>run(db.from("methods").update({name:val("mn"+c),symbol:val("ms"+c),rate:parseFloat(val("mr"+c)),info:val("mi"+c)}).eq("code",c),"Método guardado"),tgM=(c,v)=>run(db.from("methods").update({active:v}).eq("code",c),"Listo");
const addM=()=>run(db.from("methods").insert({code:val("anm").toLowerCase().replace(/[^a-z0-9]/g,"")||"m"+Date.now(),name:val("anm"),symbol:val("asy"),rate:parseFloat(val("arr"))||1,sort:99}),"Método añadido");
setTimeout(()=>{const i=$("#intro");i.style.opacity=0;setTimeout(()=>i.remove(),600)},3200);
load().then(()=>{if(REF&&!me){reg=true;go("auth")}});
</script></body></html>
