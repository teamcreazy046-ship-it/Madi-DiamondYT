`<div class="card"><b>Añadir método</b><input id="anm" placeholder="Nombre"><div class="row" style="gap:6px"><input id="asy" placeholder="Símbolo"><input id="arr" type="number" step="0.0001" placeholder="Tasa"></div><button class="btn" onclick="addM()">Añadir método</button></div>`}
if(tab==="nl"){const{data,error}=await db.functions.invoke(FN,{body:{action:"catalog"}}),em=error?await fnErr(error):"";
if(!data?.ok)h+=`<div class="card"><p class="m">No se pudo conectar con Next Level. Revisa que la función <b>${FN}</b> esté desplegada y la clave NEXTLEVEL_API_KEY configurada.${(data?.error||em)?" ("+esc(data?.error||em)+")":""}</p></div>`;
else h+=`<div class="card"><b>Saldo Nxc disponible</b><h1 class="rj">${fmt(data.account?.balance?.available??0)} NXC</h1><p class="m">Nivel ${esc(data.account?.level||"-")} · descuento ${data.account?.discountPercent??0}%</p></div><p class="m" style="margin:8px 0">Toca un producto para copiar su ID y pégalo en la oferta (pestaña Juegos).</p>`+(data.products||[]).map(p=>`<div class="card row" style="cursor:pointer" onclick="navigator.clipboard.writeText('${esc(p.productId)}').then(()=>toast('ID copiado'))"><div><b>${esc(p.name)}</b><br><span class="m">${esc(p.game?.name)} · ${esc(p.region||"")} · ${esc(p.productId)}</span></div><div style="text-align:right">${fmt(p.price.amount)} NXC<br><span class="tag ${p.available?"done":"rejected"}">${p.available?"disponible":"agotado"}</span></div></div>`).join("")}
if(tab==="notes"){const{data}=await db.from("notices").select("*").order("id",{ascending:false});h+=`<div class="card"><input id="nt" placeholder="Título"><input id="nb" placeholder="Mensaje"><button class="btn" onclick="nn()">Publicar aviso</button></div>`+(data||[]).map(n=>`<div class="card row"><div><b>${esc(n.title)}</b><p class="m">${esc(n.body)}</p></div><button class="btn sm r" onclick="dn(${n.id})">${I("x",16,2.5)}</button></div>`).join("")}
out(h)}
const run=async(p,ok)=>{const{error}=await p;if(error)return toast(error.message);toast(ok);await cat();admin()};
const ord=async(id,ok)=>{const o=(window.OL||[]).find(x=>x.id===id),e=document.getElementById("dc"+id),code=(e?.value||"").trim();if(ok&&e&&!code)return toast("Escribe el código para enviarlo");
if(ok&&o?.nl_product){toast("Enviando a Next Level…");const{data,error}=await db.functions.invoke(FN,{body:{order_id:id,action:"send"}});toast(error||!data?.ok?(data?.error||(error?await fnErr(error):"No se pudo enviar. Revisa la función en Supabase")):"Enviado a Next Level");return admin()}
return run(db.rpc("admin_order",{oid:id,ok,p_code:code||null}),"Listo")},syncO=async id=>{toast("Sincronizando…");await db.functions.invoke(FN,{body:{order_id:id,action:"sync"}});admin()},fl=(uid,f,v)=>run(db.rpc("admin_flag",{uid,f,v}),"Actualizado");
const cr=()=>run(db.rpc("admin_credit",{em:$("#ce").value.trim(),amt:parseFloat($("#ca").value)}),"Créditos aplicados");
const nn=()=>run(db.from("notices").insert({title:$("#nt").value,body:$("#nb").value}),"Aviso publicado"),dn=id=>run(db.from("notices").delete().eq("id",id),"Eliminado");
async function addG(){const n=val("ngn").trim();if(!n)return toast("Falta el nombre");let img=null;const f=$("#ngi").files[0];if(f){const u=await upl(f,"games");if(u.error)return toast(u.error);img=u.url}
run(db.from("games").insert({name:n,unit:val("ngu")||"Unidades",id_label:val("ngl")||"Player ID",kind:val("ngk"),cat:val("ngc"),img,sort:99}),"Juego añadido")}
async function saveG(id){const d={name:val("gn"+id),unit:val("gu"+id),id_label:val("gl"+id),kind:val("gk"+id),cat:val("gc"+id)};const f=$("#gi"+id).files[0];if(f){const u=await upl(f,"games");if(u.error)return toast(u.error);d.img=u.url}run(db.from("games").update(d).eq("id",id),"Guardado")}
async function saveRates(){const ms=(await db.from("methods").select("code")).data||[];const r=await Promise.all(ms.map(m=>db.from("methods").update({rate:parseFloat(val("rt"+m.code))||1}).eq("code",m.code)));run(Promise.resolve({error:r.find(x=>x.error)?.error}),"Precios actualizados")}
async function saveO(id){const r=[await db.from("offers").update({label:val("ol"+id),price:parseFloat(val("op"+id)),nl_product:val("nlp"+id).trim()||null}).eq("id",id)];for(const m of window.AM){const v=val(`pp${id}_${m.code}`).trim();r.push(v===""?await db.from("offer_prices").delete().eq("offer_id",id).eq("method_code",m.code):await db.from("offer_prices").upsert({offer_id:id,method_code:m.code,price:parseFloat(v)},{onConflict:"offer_id,method_code"}))}run(Promise.resolve({error:r.find(x=>x.error)?.error}),"Precios guardados")}
const addO=g=>run(db.from("offers").insert({game_id:g,label:val("nl"+g),price:parseFloat(val("np"+g)),sort:99}),"Oferta añadida");
const tg=(t,id,v)=>run(db.from(t).update({active:v}).eq("id",id),"Listo"),del=(t,id)=>confirm("¿Eliminar?")&&run(db.from(t).delete().eq("id",id),"Eliminado");
const saveM=c=>run(db.from("methods").update({name:val("mn"+c),symbol:val("ms"+c),rate:parseFloat(val("mr"+c)),info:val("mi"+c)}).eq("code",c),"Método guardado"),tgM=(c,v)=>run(db.from("methods").update({active:v}).eq("code",c),"Listo");
const addM=()=>run(db.from("methods").insert({code:val("anm").toLowerCase().replace(/[^a-z0-9]/g,"")||"m"+Date.now(),name:val("anm"),symbol:val("asy"),rate:parseFloat(val("arr"))||1,sort:99}),"Método añadido");
setTimeout(()=>{const i=$("#intro");i.style.opacity=0;setTimeout(()=>i.remove(),600)},3200);
load().then(()=>{if(REF&&!me){reg=true;go("auth")}});
</script></body></html>
